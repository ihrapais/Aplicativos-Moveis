name: cadastro_leitores_drift
description: Um aplicativo para cadastro de leitores usando Flutter e Drift.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqlite3_flutter_libs: ^0.5.20  # Mantido para plataformas nativas
  path_provider: ^2.1.2
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.15.0
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true